# dsh-lawcorpus — 法学论文框架语料库（本地离线，零依赖）。
#
# 安装：把本包放进 profile 的 node_modules，在 profile 的 cordis.patch.yml 里
# 插一条同样的 id/name，并在 profile package.json 的 dsh.profile.bundles 里加上
# "dsh-lawcorpus"，然后重启 DeepSeek Harness。
#
# dataDir 留空时直接读插件自带的 data/*.jsonl（近三年真实题录，只读）。
# 语料只存题录 + 摘要 + 关键词 + 目录，不存全文，不回传任何服务器。
- insert:
    - id: lawcorpus
      name: dsh-lawcorpus
      config:
        dataDir: ""
        topK: 4
        maxCards: 8
        journals: []
        enableStatus: true
        enableProfile: true
        enableFrame: true
        enableMatch: true
        enableExport: true
